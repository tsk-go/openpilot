name: sync upstream

# One click: Actions -> "sync upstream" -> Run workflow.
# Merges firestar5683/StarPilot's SecretGoodStarPilot into this branch. A merge never rewrites or drops
# commits already here, and the push is a normal (non-force) push. On a conflict nothing is pushed.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/firestar5683/StarPilot.git
  UPSTREAM_BRANCH: SecretGoodStarPilot
  BRANCH: SecretGoodStarPilot

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # GITHUB_TOKEN can't push changes to .github/workflows; a SYNC_TOKEN secret (PAT with "workflow" scope) can
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        run: |
          git config user.name Chaim
          git config user.email ""
          git fetch --no-tags "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with $UPSTREAM_BRANCH."
            exit 0
          fi
          echo "New upstream commits:"
          git log --oneline HEAD..FETCH_HEAD
          if ! git merge --no-edit -m "Merge upstream StarPilot $UPSTREAM_BRANCH" FETCH_HEAD; then
            echo "::error::Merge conflict - nothing was pushed. Conflicting files:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
